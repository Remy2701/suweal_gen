name = "suweal_gen"
version = "0.3.1"

description = "Generate gleam type definition, decoders and more from .surql"
licences = ["Apache-2.0"]
repository = { type = "github", user = "Remy2701", repo = "suweal_gen" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
argv = ">= 1.1.0 and < 2.0.0"
shellout = ">= 1.8.0 and < 2.0.0"
clip = ">= 1.2.2 and < 2.0.0"
suweal = ">= 0.4.0 and < 1.0.0"
omcg = ">= 0.3.1 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
birdie = ">= 2.0.2 and < 3.0.0"
